# Funkel & Luna | zentrale Gerätezuordnung für die öffentliche Vorlage
# Wird als ZWEITES Package unter /config/packages/funkel_luna_geraete.yaml geladen.
# NICHT zusammen mit privaten Entity-IDs öffentlich veröffentlichen.
#
# Browser-Testmodus (Standard): "input_boolean.funkel_luna_browser_test" ist AN.
# Alle neun Medien-Aliasse zeigen zunächst auf "media_player.funkel_browser".
# Diese Entity muss durch Browser Mod bereitgestellt werden: Browser registrieren
# und sein media_player-Entity in HA auf media_player.funkel_browser umbenennen,
# ODER alle neun "children"-Einträge unten auf die echte Browser-ID setzen.
#
# Realmodus: input_boolean.funkel_luna_browser_test ausschalten und NUR hier
# die neun Player-Zielentities und vier Light-/Cover-Zielentities ändern.
# Die IDs "media_player.funkel_..." / "light.funkel_..." / "cover.funkel_..."
# sind stabile ALIAS-Namen, die Package und Dashboard verwenden.

input_boolean:
  funkel_luna_browser_test:
    name: Funkel & Luna | Browser-Testmodus
    icon: mdi:web
    initial: true
  funkel_demo_licht_3:
    name: Funkel Demo | Lichteffekt 3
    initial: false
  funkel_demo_licht_4:
    name: Funkel Demo | Lichteffekt 4
    initial: false
  funkel_demo_rollo_4_a:
    name: Funkel Demo | Rollo 4A geschlossen
    initial: false
  funkel_demo_rollo_4_b:
    name: Funkel Demo | Rollo 4B geschlossen
    initial: false

# Medienplayer-Aliasse: children ist jeweils die ECHTE Entity-ID.
# Für das Browser-Demo zeigen alle Aliasse auf den gleichen Browser Mod Player.
# In echten Installationen z.B. Audio auf Lautsprecher, Video auf Kodi setzen.
media_player:
  # Audio: Station 1
  - platform: universal
    name: funkel_audio_station_1
    unique_id: ha_funkel_luna_funkel_audio_station_1
    children:
      - media_player.funkel_browser

  # Audio: Station 2
  - platform: universal
    name: funkel_audio_station_2
    unique_id: ha_funkel_luna_funkel_audio_station_2
    children:
      - media_player.funkel_browser

  # Audio: Station 3
  - platform: universal
    name: funkel_audio_station_3
    unique_id: ha_funkel_luna_funkel_audio_station_3
    children:
      - media_player.funkel_browser

  # Audio: Station 4
  - platform: universal
    name: funkel_audio_station_4
    unique_id: ha_funkel_luna_funkel_audio_station_4
    children:
      - media_player.funkel_browser

  # Audio: Station 5
  - platform: universal
    name: funkel_audio_station_5
    unique_id: ha_funkel_luna_funkel_audio_station_5
    children:
      - media_player.funkel_browser

  # Video: Station 1
  - platform: universal
    name: funkel_kodi_station_1
    unique_id: ha_funkel_luna_funkel_kodi_station_1
    children:
      - media_player.funkel_browser

  # Video: Station 6
  - platform: universal
    name: funkel_kodi_station_6
    unique_id: ha_funkel_luna_funkel_kodi_station_6
    children:
      - media_player.funkel_browser

  # ADB/Fire TV: Station 1 (nur Realmodus)
  - platform: universal
    name: funkel_tv_station_1
    unique_id: ha_funkel_luna_funkel_tv_station_1
    children:
      - media_player.funkel_browser

  # ADB/Fire TV: Station 6 (nur Realmodus)
  - platform: universal
    name: funkel_tv_station_6
    unique_id: ha_funkel_luna_funkel_tv_station_6
    children:
      - media_player.funkel_browser

# Lichter und Rollos werden im Testmodus durch Input-Booleans simuliert.
# Im Realmodus werden hier die VIER echten Geräte-IDs eingetragen.
template:
  - light:
      - name: funkel_effekt_station_3
        unique_id: ha_funkel_luna_funkel_effekt_station_3
        state: "{{ is_state('input_boolean.funkel_demo_licht_3', 'on') if is_state('input_boolean.funkel_luna_browser_test', 'on') else is_state('light.beispiel_licht_station_3', 'on') }}"
        turn_on:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_demo_licht_3
            else:
              - action: light.turn_on
                target:
                  entity_id: light.beispiel_licht_station_3
        turn_off:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.funkel_demo_licht_3
            else:
              - action: light.turn_off
                target:
                  entity_id: light.beispiel_licht_station_3
        set_level:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_demo_licht_3
            else:
              - action: light.turn_on
                target:
                  entity_id: light.beispiel_licht_station_3
                data:
                  brightness: "{{ brightness }}"
      - name: funkel_effekt_station_4
        unique_id: ha_funkel_luna_funkel_effekt_station_4
        state: "{{ is_state('input_boolean.funkel_demo_licht_4', 'on') if is_state('input_boolean.funkel_luna_browser_test', 'on') else is_state('light.beispiel_licht_station_4', 'on') }}"
        turn_on:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_demo_licht_4
            else:
              - action: light.turn_on
                target:
                  entity_id: light.beispiel_licht_station_4
        turn_off:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.funkel_demo_licht_4
            else:
              - action: light.turn_off
                target:
                  entity_id: light.beispiel_licht_station_4
        set_level:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_demo_licht_4
            else:
              - action: light.turn_on
                target:
                  entity_id: light.beispiel_licht_station_4
                data:
                  brightness: "{{ brightness }}"
  - cover:
      - name: funkel_rollo_station_4_a
        unique_id: ha_funkel_luna_funkel_rollo_station_4_a
        device_class: shutter
        state: "{{ ('closed' if is_state('input_boolean.funkel_demo_rollo_4_a', 'on') else 'open') if is_state('input_boolean.funkel_luna_browser_test', 'on') else states('cover.beispiel_rollo_station_4_a') }}"
        close_cover:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_demo_rollo_4_a
            else:
              - action: cover.close_cover
                target:
                  entity_id: cover.beispiel_rollo_station_4_a
        open_cover:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.funkel_demo_rollo_4_a
            else:
              - action: cover.open_cover
                target:
                  entity_id: cover.beispiel_rollo_station_4_a
      - name: funkel_rollo_station_4_b
        unique_id: ha_funkel_luna_funkel_rollo_station_4_b
        device_class: shutter
        state: "{{ ('closed' if is_state('input_boolean.funkel_demo_rollo_4_b', 'on') else 'open') if is_state('input_boolean.funkel_luna_browser_test', 'on') else states('cover.beispiel_rollo_station_4_b') }}"
        close_cover:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_demo_rollo_4_b
            else:
              - action: cover.close_cover
                target:
                  entity_id: cover.beispiel_rollo_station_4_b
        open_cover:
          - if:
              - condition: state
                entity_id: input_boolean.funkel_luna_browser_test
                state: "on"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.funkel_demo_rollo_4_b
            else:
              - action: cover.open_cover
                target:
                  entity_id: cover.beispiel_rollo_station_4_b
