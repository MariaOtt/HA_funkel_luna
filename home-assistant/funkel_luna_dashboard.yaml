title: Funkel & Luna
views:
  - title: Spielleitung
    path: spielleitung
    icon: mdi:unicorn-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-title-card
            title: 🐉 Funkel & Luna · Spielleitung
            subtitle: Das Regenbogen-Abenteuer 🌈  ·  6 Stationen  ·  7 Aufgaben
            grid_options:
              columns: full
              rows: auto
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                content: >-
                  {% if is_state('input_select.funkel_luna_station',
                  'Geschafft') %}GESCHAFFT{% elif
                  is_state('input_boolean.funkel_luna_finale_erledigt', 'on')
                  %}FINALE LÄUFT{% elif
                  is_state('input_boolean.funkel_luna_3a_countdown', 'on') %}3A
                  IN 10 SEKUNDEN{% elif
                  is_state('input_boolean.funkel_luna_spiel_aktiv', 'on')
                  %}SPIEL LÄUFT{% else %}BEREIT{% endif %}
                icon: >-
                  {{ 'mdi:trophy' if
                  is_state('input_select.funkel_luna_station', 'Geschafft') else
                  'mdi:play-circle' if
                  is_state('input_boolean.funkel_luna_spiel_aktiv','on') else
                  'mdi:pause-circle-outline' }}
                icon_color: >-
                  {{ 'green' if is_state('input_select.funkel_luna_station',
                  'Geschafft') else 'amber' if
                  is_state('input_boolean.funkel_luna_finale_erledigt','on')
                  else 'green' if
                  is_state('input_boolean.funkel_luna_spiel_aktiv','on') else
                  'grey' }}
              - type: template
                content: >-
                  {{ states('sensor.funkel_luna_version_hauptpackage') if
                  states('sensor.funkel_luna_version_hauptpackage') not in
                  ['unknown','unavailable','none',''] else '?' }} (4.19)
                icon: mdi:source-branch
                icon_color: blue
                tap_action:
                  action: none
            grid_options:
              columns: full
              rows: auto
          - type: heading
            heading: 🎮 Übersicht & Regie
            heading_style: title
            grid_options:
              columns: full
              rows: auto
          - square: false
            type: grid
            columns: 1
            cards:
              - type: vertical-stack
                cards:
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:ring-tile
                        entity: sensor.funkel_luna_fortschritt
                        name: Fortschritt
                        min: 0
                        max: 100
                        ring_size: 4
                      - type: vertical-stack
                        cards:
                          - type: custom:mushroom-template-card
                            primary: Aktuelle Station
                            secondary: '{{ states(''input_select.funkel_luna_station'') }}'
                            icon: mdi:map-marker-path
                            color: purple
                            multiline_secondary: true
                            tap_action:
                              action: none
                          - type: custom:mushroom-template-card
                            primary: Spiel vorbereiten
                            secondary: Rollos schließen · ohne Clip
                            icon: mdi:play-circle-outline
                            color: green
                            multiline_secondary: true
                            tap_action:
                              action: perform-action
                              perform_action: script.funkel_luna_spiel_starten
                          - type: custom:mushroom-template-card
                            primary: MEDIEN-STOPP
                            secondary: Alle Clipfolgen beenden
                            icon: mdi:stop-circle
                            color: red
                            multiline_secondary: true
                            tap_action:
                              action: perform-action
                              perform_action: script.funkel_luna_stopp_alle
                          - type: custom:mushroom-template-card
                            primary: Spiel zurücksetzen
                            secondary: Haken, Status & Wiedergabe zurücksetzen
                            icon: mdi:restart
                            color: red
                            multiline_secondary: true
                            tap_action:
                              action: perform-action
                              perform_action: script.funkel_luna_zuruecksetzen
                              confirmation:
                                text: Alle Aufgaben zurücksetzen und Medien stoppen?
                            grid_options:
                              columns: 12
                              rows: auto
                    grid_options:
                      columns: 12
                      rows: auto
            grid_options:
              columns: 18
              rows: auto
          - type: heading
            heading: 🧭 Szenenregie · 6 Stationen
            heading_style: title
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: 🍽️ 1 · Drachennest
            heading_style: title
            grid_options:
              columns: 12
              rows: auto
            badges:
              - type: entity
                entity: input_boolean.funkel_luna_nest_erledigt
                name: Nest & Hilferuf
                icon: mdi:bird
                color: green
                show_state: false
                tap_action:
                  action: none
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Szene starten
                secondary: Einleitungsclip
                icon: mdi:play-circle
                color: green
                multiline_secondary: true
                tap_action:
                  action: perform-action
                  perform_action: script.funkel_luna_station_1_starten
              - type: custom:mushroom-template-card
                primary: Einzelsteuerung
                secondary: Medien & Geräte
                icon: mdi:tune
                color: purple
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /funkel-luna/szene-1
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: 1 · Nest & Hilferuf
            secondary: >-
              {{ '✓ Erledigt · ' if
              is_state('input_boolean.funkel_luna_nest_erledigt','on') else '○
              Offen · ' }}Nur Fortschritt, kein zusätzlicher Clip
            icon: mdi:bird
            color: >-
              {{ 'green' if
              is_state('input_boolean.funkel_luna_nest_erledigt','on') else
              'grey' }}
            entity: input_boolean.funkel_luna_nest_erledigt
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: Ablauf & Auslöser
            secondary: >-
              1A: Funkel–Luna–Funkel. Danach automatisch Kodi & 1B_1 → 1B_2.
              Nest-Haken: nur Fortschritt. Weiter zu Station 2 manuell.
            icon: mdi:script-text-outline
            color: blue
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: |-
              ### ✨ Gemeinsamer Ruf

              > **„DRACHENMUT UND EINHORNGLANZ!“**

              *Ruf beim Auftakt mit Funkel und Luna*
            grid_options:
              columns: 12
              rows: auto
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 🌈 2 · Regenbogen
            heading_style: title
            grid_options:
              columns: 12
              rows: auto
            badges:
              - type: entity
                entity: input_boolean.funkel_luna_regenbogen_erledigt
                name: Regenbogen
                icon: mdi:looks
                color: green
                show_state: false
                tap_action:
                  action: none
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Szene starten
                secondary: Einleitungsclip
                icon: mdi:play-circle
                color: green
                multiline_secondary: true
                tap_action:
                  action: perform-action
                  perform_action: script.funkel_luna_station_2_starten
              - type: custom:mushroom-template-card
                primary: Einzelsteuerung
                secondary: Medien & Geräte
                icon: mdi:tune
                color: purple
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /funkel-luna/szene-2
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: 2 · Regenbogen repariert
            secondary: >-
              {{ '✓ Erledigt · ' if
              is_state('input_boolean.funkel_luna_regenbogen_erledigt','on')
              else '○ Offen · ' }}Startet Video 2B → 10 s → Audio 3A
            icon: mdi:looks
            color: >-
              {{ 'green' if
              is_state('input_boolean.funkel_luna_regenbogen_erledigt','on')
              else 'grey' }}
            entity: input_boolean.funkel_luna_regenbogen_erledigt
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: Ablauf & Auslöser
            secondary: >-
              2A: drei Audios. Haken „Regenbogen“ → Video 2B. Nach dem Video: 10
              Sekunden → 3A in Spielbereich 3. Stationswechsel manuell.
            icon: mdi:script-text-outline
            color: blue
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: auto
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 💎 3 · Zaubersteine
            heading_style: title
            grid_options:
              columns: 12
              rows: auto
            badges:
              - type: entity
                entity: input_boolean.funkel_luna_steine_erledigt
                name: Zaubersteine
                icon: mdi:diamond-stone
                color: green
                show_state: false
                tap_action:
                  action: none
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Szene starten
                secondary: Einleitungsclip
                icon: mdi:play-circle
                color: green
                multiline_secondary: true
                tap_action:
                  action: perform-action
                  perform_action: script.funkel_luna_station_3_starten
              - type: custom:mushroom-template-card
                primary: Einzelsteuerung
                secondary: Medien & Geräte
                icon: mdi:tune
                color: purple
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /funkel-luna/szene-3
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: 3 · Zaubersteine gefunden
            secondary: >-
              {{ '✓ Erledigt · ' if
              is_state('input_boolean.funkel_luna_steine_erledigt','on') else '○
              Offen · ' }}Rainbow B + Lava-Licht (100 %) → nach 2 s Audio 3B
            icon: mdi:diamond-stone
            color: >-
              {{ 'green' if
              is_state('input_boolean.funkel_luna_steine_erledigt','on') else
              'grey' }}
            entity: input_boolean.funkel_luna_steine_erledigt
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: Ablauf & Auslöser
            secondary: >-
              3A spricht über den Spielbereich 3-Speaker. Haken „Zaubersteine“ → Rainbow B
              bei Spielbereich 3 und Lava-Licht bei Spielbereich 4 (beide 100 %), nach 2 s
              Funkel 3B. Nächste Station manuell starten.
            icon: mdi:script-text-outline
            color: blue
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: >-
              ### ✨ Gemeinsamer Ruf


              > **„Glitzerstein und Funkellicht, versteck die Zauberkraft jetzt
              nicht!“**


              *Zauberspruch zu den Kartoffel-/Zaubersteinen*
            grid_options:
              columns: 12
              rows: auto
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 🌋 4 · Lavafeld
            heading_style: title
            grid_options:
              columns: 12
              rows: auto
            badges:
              - type: entity
                entity: input_boolean.funkel_luna_lava_erledigt
                name: Lavafeld
                icon: mdi:fire
                color: green
                show_state: false
                tap_action:
                  action: none
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Szene starten
                secondary: Einleitungsclip
                icon: mdi:play-circle
                color: green
                multiline_secondary: true
                tap_action:
                  action: perform-action
                  perform_action: script.funkel_luna_station_4_starten
              - type: custom:mushroom-template-card
                primary: Einzelsteuerung
                secondary: Medien & Geräte
                icon: mdi:tune
                color: purple
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /funkel-luna/szene-4
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: 4 · Lavafeld überquert
            secondary: >-
              {{ '✓ Erledigt · ' if
              is_state('input_boolean.funkel_luna_lava_erledigt','on') else '○
              Offen · ' }}Audio 4B → 3 s → 5A_1 im Spielbereich 5
            icon: mdi:fire
            color: >-
              {{ 'green' if
              is_state('input_boolean.funkel_luna_lava_erledigt','on') else
              'grey' }}
            entity: input_boolean.funkel_luna_lava_erledigt
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: Ablauf & Auslöser
            secondary: >-
              Lava-Licht ist seit dem Erfolg in Station 3 aktiv. Start 4A:
              Dialog und Feuereffekt. Haken „Lavafeld“ → 4B; 3 Sekunden nach
              dessen Ende spricht 5A_1 aus dem Spielbereich 5. Station 5 danach manuell
              starten (5A_2).
            icon: mdi:script-text-outline
            color: blue
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: >-
              ### ✨ Gemeinsamer Ruf


              > **„Blubber, blubber, Drachenmut, unser Vulkan, der wird jetzt
              gut!“**


              *Zauberspruch am Lavafeld*
            grid_options:
              columns: 12
              rows: auto
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 🐉 5 · Schlüssel & Ei
            heading_style: title
            grid_options:
              columns: 12
              rows: auto
            badges:
              - type: entity
                entity: input_boolean.funkel_luna_schluessel_erledigt
                name: Drachenschlüssel
                icon: mdi:key-variant
                color: green
                show_state: false
                tap_action:
                  action: none
              - type: entity
                entity: input_boolean.funkel_luna_drachenei_erledigt
                name: Drachenei
                icon: mdi:egg-easter
                color: green
                show_state: false
                tap_action:
                  action: none
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Szene starten
                secondary: Einleitungsclip
                icon: mdi:play-circle
                color: green
                multiline_secondary: true
                tap_action:
                  action: perform-action
                  perform_action: script.funkel_luna_station_5_starten
              - type: custom:mushroom-template-card
                primary: Einzelsteuerung
                secondary: Medien & Geräte
                icon: mdi:tune
                color: purple
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /funkel-luna/szene-5
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: 5 · Drachenschlüssel fertig
            secondary: >-
              {{ '✓ Erledigt · ' if
              is_state('input_boolean.funkel_luna_schluessel_erledigt','on')
              else '○ Offen · ' }}Startet Dialogfolge 5B
            icon: mdi:key-variant
            color: >-
              {{ 'green' if
              is_state('input_boolean.funkel_luna_schluessel_erledigt','on')
              else 'grey' }}
            entity: input_boolean.funkel_luna_schluessel_erledigt
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: 6 · Drachenei gefunden
            secondary: >-
              {{ '✓ Erledigt · ' if
              is_state('input_boolean.funkel_luna_drachenei_erledigt','on') else
              '○ Offen · ' }}Startet Dialogfolge 5C
            icon: mdi:egg-easter
            color: >-
              {{ 'green' if
              is_state('input_boolean.funkel_luna_drachenei_erledigt','on') else
              'grey' }}
            entity: input_boolean.funkel_luna_drachenei_erledigt
            multiline_secondary: true
            tap_action:
              action: toggle
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: Ablauf & Auslöser
            secondary: >-
              Nach Ende von 4B wurde 5A_1 bereits automatisch abgespielt. Start
              von Station 5 spielt nur 5A_2. Schlüssel-Haken → 5B,
              Drachenei-Haken → 5C. Station 6 manuell starten.
            icon: mdi:script-text-outline
            color: blue
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: >-
              ### ✨ Gemeinsamer Ruf


              > **„Drachenei, erwache sacht, bring zurück die Zaubermacht!“**


              *Der bestätigte Spruch gehört zum Drachenei (5C). Für den
              Drachenschlüssel ist kein weiterer gemeinsamer Spruch hinterlegt.*
            grid_options:
              columns: 12
              rows: auto
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 🎁 6 · Schatz
            heading_style: title
            grid_options:
              columns: 12
              rows: auto
            badges:
              - type: entity
                entity: input_boolean.funkel_luna_finale_erledigt
                name: Schatz
                icon: mdi:treasure-chest
                color: green
                show_state: false
                tap_action:
                  action: none
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Szene starten
                secondary: Einleitungsclip
                icon: mdi:play-circle
                color: green
                multiline_secondary: true
                tap_action:
                  action: perform-action
                  perform_action: script.funkel_luna_station_6_starten
              - type: custom:mushroom-template-card
                primary: Einzelsteuerung
                secondary: Medien & Geräte
                icon: mdi:tune
                color: purple
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /funkel-luna/szene-6
            grid_options:
              columns: 12
              rows: auto
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.funkel_luna_6b1_abgeschlossen
                state: false
            card:
              type: custom:mushroom-template-card
              primary: 7 · Schatz gefunden
              secondary: '⏳ Noch gesperrt: Erst Video 6B_1 vollständig ansehen'
              icon: mdi:treasure-chest
              color: grey
              entity: input_boolean.funkel_luna_finale_erledigt
              multiline_secondary: true
              tap_action:
                action: none
            grid_options:
              columns: 12
              rows: auto
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.funkel_luna_6b1_abgeschlossen
                state: true
            card:
              type: custom:mushroom-template-card
              primary: 7 · Schatz gefunden
              secondary: >-
                {% if is_state('input_select.funkel_luna_station','Geschafft')
                %}✓ Abenteuer abgeschlossen{% elif
                is_state('input_boolean.funkel_luna_finale_erledigt','on')
                %}Finale 6B_2 läuft{% else %}Jetzt Schatzfund bestätigen → Video
                6B_2{% endif %}
              icon: mdi:treasure-chest
              color: >-
                {{ 'green' if
                is_state('input_boolean.funkel_luna_finale_erledigt','on') else
                'grey' }}
              entity: input_boolean.funkel_luna_finale_erledigt
              multiline_secondary: true
              tap_action:
                action: perform-action
                perform_action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.funkel_luna_finale_erledigt
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: Ablauf & Auslöser
            secondary: >-
              Start 6A über ADB/Kodi, danach automatisch 6B_1. Erst nach
              bestätigtem Ende von 6B_1 wird der Schatz-Haken freigegeben →
              6B_2. Nach dessen Ende: GESCHAFFT.
            icon: mdi:script-text-outline
            color: blue
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: auto
        column_span: 1
    dense_section_placement: false
  - title: 1 · Drachennest · Einzelsteuerung
    path: szene-1
    subview: true
    back_path: /funkel-luna/spielleitung
    icon: mdi:table-furniture
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🍽️ 1 · Drachennest · Einzelsteuerung
            heading_style: title
          - type: custom:mushroom-title-card
            title: Spielbereich 1 · Regiepult
            subtitle: >-
              Jede Datei unabhängig starten · Fortschritt nicht automatisch
              ändern
          - type: markdown
            content: |-
              ### ✨ Gemeinsamer Ruf

              > **„DRACHENMUT UND EINHORNGLANZ!“**

              *Ruf beim Auftakt mit Funkel und Luna*
          - type: custom:mushroom-template-card
            primary: Zurück zur Spielleitung
            secondary: Alle Stationen
            icon: mdi:arrow-left
            color: purple
            multiline_secondary: true
            tap_action:
              action: navigate
              navigation_path: /funkel-luna/spielleitung
          - type: custom:mushroom-template-card
            primary: Szene neu starten
            secondary: Stoppt andere Medien und setzt Station
            icon: mdi:play-circle
            color: green
            multiline_secondary: true
            tap_action:
              action: perform-action
              perform_action: script.funkel_luna_station_1_starten
          - type: custom:mushroom-template-card
            primary: Aktive Station
            secondary: '{{ states(''input_select.funkel_luna_station'') }}'
            icon: mdi:map-marker-path
            color: purple
            multiline_secondary: true
            tap_action:
              action: none
          - type: custom:mushroom-template-card
            primary: MEDIEN-STOPP
            secondary: Alle laufenden Folgen und Player abbrechen
            icon: mdi:stop-circle
            color: red
            multiline_secondary: true
            tap_action:
              action: perform-action
              perform_action: script.funkel_luna_stopp_alle
          - type: custom:mushroom-entity-card
            entity: input_boolean.funkel_luna_nest_erledigt
            name: Nest und Hilferuf erledigt
            icon: mdi:check-circle-outline
            tap_action:
              action: toggle
            secondary_info: state
      - type: grid
        cards:
          - type: heading
            heading: 🎬 1A · Audio
            heading_style: title
          - type: custom:mushroom-template-card
            primary: 1A · Ganze Clipfolge
            secondary: >-
              1A und danach automatisch Video 1B (wenn alle Audios regulär
              enden)
            icon: mdi:playlist-play
            color: green
            multiline_secondary: true
            tap_action:
              action: perform-action
              perform_action: script.funkel_luna_1a
          - type: custom:mushroom-template-card
            primary: ▶ Clip1A_1_Funkel.mp3
            secondary: Einzeln auf media_player.funkel_audio_station_1 abspielen, keine Folgeaktionen
            icon: mdi:music-note
            color: blue
            multiline_secondary: true
            tap_action:
              action: perform-action
              perform_action: script.funkel_luna_einzelclip
              data:
