  funkel_luna_einzelclip:
    alias: Funkel & Luna · Einzeldatei (Fallback, ohne Folgeautomation)
    icon: mdi:play-box-outline
    mode: parallel
    max: 20
    fields:
      player:
        name: media_player-Entity
        required: true
        selector:
          text:
            type: text
      ordner:
        name: Audio oder Video
        required: true
        selector:
          select:
            options:
            - Audio
            - Video
      datei:
        name: Vollständiger Dateiname
        required: true
        selector:
          text:
            type: text
    sequence:
    - condition: template
      value_template: '{{ player in [''media_player.funkel_audio_station_1'', ''media_player.funkel_kodi_station_1'', ''media_player.funkel_audio_station_2'', ''media_player.funkel_audio_station_3'', ''media_player.funkel_audio_station_4'',
        ''media_player.funkel_audio_station_5'', ''media_player.funkel_kodi_station_6''] and ((ordner == ''Audio'' and datei in [''Clip1A_1_Funkel.mp3'', ''Clip1A_2_Luna.mp3'',
        ''Clip1A_3_Funkel.mp3'', ''Clip2A_1_Luna.mp3'', ''Clip2A_2_Funkel.mp3'', ''Clip2A_3_Luna.mp3'', ''Clip3A_1_Funkel.mp3'', ''Clip3A_2_Luna.mp3'',
        ''Clip3B_1_Funkel.mp3'', ''Clip4A_1_Funkel.mp3'', ''Clip4A_2_Luna.mp3'', ''Clip4B_1_Funkel.mp3'', ''Clip5A_1_Luna.mp3'', ''Clip5A_2_Luna.mp3'',
        ''Clip5B_1_Funkel.mp3'', ''Clip5B_2_Luna.mp3'', ''Clip5C_1_Luna.mp3'', ''Clip5C_2_Luna.mp3'']) or (ordner == ''Video'' and datei in [''Clip1B_1.mp4'',
        ''Clip1B_2.mp4'', ''Clip2B.mp4'', ''Clip6A.mp4'', ''Clip6B_1.mp4'', ''Clip6B_2.mp4''])) }}'
    - if:
      - '{{ ordner == ''Video'' and player in [''media_player.funkel_kodi_station_1'', ''media_player.funkel_kodi_station_6''] }}'
      then:
      - alias: Kodi per ADB aktivieren, bevor die Einzeldatei gestartet wird
        action: script.funkel_luna_kodi_vorbereiten
        data:
          geraet: '{{ ''Medienzone_1'' if player == ''media_player.funkel_kodi_station_1'' else ''Spielbereich 6'' }}'
    - if:
      - "{{ ordner == 'Audio' and player in ['media_player.funkel_audio_station_1', 'media_player.funkel_audio_station_3', 'media_player.funkel_audio_station_4', 'media_player.funkel_audio_station_5'] }}"
      then:
      - alias: Nur Google-Nest-Audioausgaben auf 80 Prozent setzen (nicht Gäste-TV)
        action: media_player.volume_set
        target:
          entity_id: '{{ player }}'
        data:
          volume_level: 0.8
        continue_on_error: true
    - action: media_player.play_media
      target:
        entity_id: '{{ player }}'
      data:
        media_content_id: '{{ ''media-source://media_source/local/funkel_luna/'' ~ ordner ~ ''/'' ~ datei }}'
        media_content_type: '{{ ''video/mp4'' if ordner == ''Video'' else ''audio/mpeg'' }}'
