  funkel_luna_player_steuern:
    alias: Funkel & Luna · Medien-Player manuell bedienen
    mode: parallel
    max: 15
    fields:
      player:
        name: Media-Player
        required: true
        selector:
          text:
            type: text
      befehl:
        name: Befehl
        required: true
        selector:
          select:
            options:
            - pause
            - weiter
            - lauter
            - leiser
    sequence:
    - condition: template
      value_template: '{{ player.startswith(''media_player.'') and befehl in [''pause'',''weiter'',''lauter'',''leiser''] }}'
    - choose:
      - conditions:
        - '{{ befehl == ''pause'' }}'
        sequence:
        - action: media_player.media_pause
          target:
            entity_id: '{{ player }}'
      - conditions:
        - '{{ befehl == ''weiter'' }}'
        sequence:
        - action: media_player.media_play
          target:
            entity_id: '{{ player }}'
      - conditions:
        - '{{ befehl == ''lauter'' }}'
        sequence:
        - action: media_player.volume_up
          target:
            entity_id: '{{ player }}'
      - conditions:
        - '{{ befehl == ''leiser'' }}'
        sequence:
        - action: media_player.volume_down
          target:
            entity_id: '{{ player }}'
