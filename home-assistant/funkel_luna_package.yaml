- id: funkel_luna_erfolg_finale_v46
  alias: Funkel & Luna · Erfolg Schatz gefunden → Abschlussclip
  description: Nur wenn 6B_1 wirklich beendet wurde. 6B_2 erst dann per Erfolgshaken; Geschafft erst nach bestätigtem Ende von 6B_2.
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.funkel_luna_finale_erledigt
    from: 'off'
    to: 'on'
  actions:
  - if:
    - "{{ not is_state('input_boolean.funkel_luna_6b1_abgeschlossen', 'on') }}"
    then:
    - alias: Zu früh gesetzten Schatz-Haken zurücknehmen
      action: input_boolean.turn_off
      target:
        entity_id: input_boolean.funkel_luna_finale_erledigt
    - action: persistent_notification.create
      data:
        title: Funkel & Luna · Schatzfund noch gesperrt
        message: Bitte das tatsächliche Ende von Video 6B_1 abwarten. Der Erfolgshaken wurde zurückgenommen.
    - stop: Video 6B_1 wurde noch nicht vollständig beendet.
  - alias: Schatz wurde gefunden (Status freigeben)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.funkel_luna_schatz_freigegeben
  - alias: 6B_2 über Kodi abspielen und auf das bestätigte Ende warten
    action: script.funkel_luna_6b_2
  - alias: Erst nach 6B_2 Spiel als Geschafft markieren
    action: script.funkel_luna_schatz_freigeben
