# Funkel & Luna · Haupt-Package 4.17
# Ein Package: Skripte, Helfer, Aufgaben-Automationen und Fortschritts-/Versionssensor.
input_select:
  funkel_luna_station:
    name: Funkel & Luna · Station
    icon: mdi:map-marker-path
    options:
    - Bereit
    - 1 · Drachennest
    - 2 · Regenbogen
    - 3 · Zaubersteine
    - 4 · Lavafeld
    - 5 · Schlüssel & Ei
    - 6 · Schatz
    - Geschafft
input_boolean:
  funkel_luna_spiel_aktiv:
    name: Funkel & Luna · Spiel aktiv
    icon: mdi:play-circle
  funkel_luna_schatz_freigegeben:
    name: Funkel & Luna · Schatz freigegeben
    icon: mdi:treasure-chest
  funkel_luna_3a_countdown:
    name: Funkel & Luna · 3A startet nach 10 Sekunden
    icon: mdi:timer-sand
  funkel_luna_nest_erledigt:
    name: Funkel & Luna · Nest und Hilferuf erledigt
    icon: mdi:check-decagram
  funkel_luna_regenbogen_erledigt:
    name: Funkel & Luna · Regenbogen repariert und Fundstück gefunden
    icon: mdi:check-decagram
  funkel_luna_steine_erledigt:
    name: Funkel & Luna · Kartoffelsteine / Zaubersteine gefunden
    icon: mdi:check-decagram
  funkel_luna_lava_erledigt:
    name: Funkel & Luna · Lavafeld überquert
    icon: mdi:check-decagram
  funkel_luna_schluessel_erledigt:
    name: Funkel & Luna · Drachenschlüssel zusammengesetzt
    icon: mdi:check-decagram
  funkel_luna_drachenei_erledigt:
    name: Funkel & Luna · Drachenei gefunden
    icon: mdi:check-decagram
  funkel_luna_finale_erledigt:
    name: Funkel & Luna · Schatz gefunden / Finale geschafft
    icon: mdi:check-decagram
  funkel_luna_5a1_abgeschlossen:
    name: Funkel & Luna · Übergangsansage im Spielbereich 5 (5A_1) beendet
    icon: mdi:check-circle-outline
  funkel_luna_6b1_abgeschlossen:
    name: Funkel & Luna · Finale 6B_1 beendet / Schatzfund freigeben
    icon: mdi:check-circle-outline
script:
  funkel_luna_kodi_vorbereiten:
    alias: Funkel & Luna · Kodi vor Video auf Fire TV öffnen (ADB)
    icon: mdi:kodi
    mode: parallel
    max: 3
    fields:
      geraet:
        name: Fire TV
        required: true
        selector:
          select:
            options:
            - Medienzone_1
            - Spielbereich 6
    sequence:
    # Im Browser-Testmodus laufen Videos auf dem Browser-Mod-Player.
    # Die Fire-TV-/Kodi-App muss deshalb nicht vorbereitet werden.
    - if:
      - condition: state
        entity_id: input_boolean.funkel_luna_browser_test
        state: "on"
      then:
      - stop: "Browser-Testmodus: Fire-TV-/Kodi-Vorbereitung übersprungen"
    - condition: template
      value_template: '{{ geraet in [''Medienzone_1'', ''Spielbereich 6''] }}'
    - variables:
        adb_player: '{{ ''media_player.funkel_tv_station_1'' if geraet == ''Medienzone_1'' else ''media_player.funkel_tv_station_6'' }}'
        kodi_player: '{{ ''media_player.funkel_kodi_station_1'' if geraet == ''Medienzone_1'' else ''media_player.funkel_kodi_station_6'' }}'
    - alias: 'ADB: Fire TV vor dem Quellenwechsel einschalten / aufwecken'
      action: media_player.turn_on
      target:
        entity_id: '{{ adb_player }}'
      continue_on_error: true
    - alias: 'ADB: auf erreichbaren Fire TV warten'
      wait_template: '{{ states(adb_player) not in [''unavailable'', ''unknown''] }}'
      timeout: 00:00:20
      continue_on_timeout: true
    - if:
      - '{{ not wait.completed }}'
      then:
      - action: persistent_notification.create
        data:
          title: Funkel & Luna · Fire TV nicht erreichbar
          message: ADB-Player {{ adb_player }} ist nicht erreichbar. Kodi und Video wurden nicht gestartet.
      - stop: ADB-Player nach Aufweckversuch nicht erreichbar.
        error: true
    - alias: Fire TV nach dem Aufwecken kurz stabilisieren lassen
      delay: 00:00:03
    - alias: 'ADB: Kodi als App/Quelle auswählen'
      action: media_player.select_source
      target:
        entity_id: '{{ adb_player }}'
      data:
        source: Kodi
    - alias: 'ADB: Warten, bis Kodi wirklich als laufende App gemeldet wird'
      wait_template: '{{ (state_attr(adb_player, ''source'') | default('''', true) | lower) in [''kodi'', ''org.xbmc.kodi''] or (state_attr(adb_player,
        ''app_id'') | default('''', true)) == ''org.xbmc.kodi'' }}'
      timeout: 00:00:25
      continue_on_timeout: true
    - if:
      - '{{ not wait.completed }}'
      then:
      - action: persistent_notification.create
        data:
          title: Funkel & Luna · Kodi nicht im Vordergrund
          message: Kodi wurde auf {{ adb_player }} nicht als aktive App bestätigt. Video wird nicht gestartet, damit nicht nur Ton läuft. Prüfe 
            ADB-Quelle Kodi und starte erneut.
      - stop: ADB meldet Kodi nicht als aktive App. Video-Start aus Sicherheitsgründen abgebrochen.
        error: true
    - alias: Kodi-Integration muss bereit/erreichbar sein
      wait_template: '{{ states(kodi_player) not in [''unknown'', ''unavailable'', ''off''] }}'
      timeout: 00:00:25
      continue_on_timeout: true
    - if:
      - '{{ not wait.completed }}'
      then:
      - action: persistent_notification.create
        data:
          title: Funkel & Luna · Kodi-Player noch nicht bereit
          message: Auf {{ kodi_player }} ist Kodi noch nicht erreichbar. Die Videowiedergabe wurde nicht gestartet. Prüfe den Kodi-Dienst bzw. 
            das Fire TV.
      - stop: Kodi-Player nicht bereit. Videostart abgebrochen.
        error: true
    - alias: Kodi die Anzeige im Vordergrund aufbauen lassen
      delay: 00:00:02
  funkel_luna_1a:
    alias: Funkel & Luna · 1A (3 Dateien)
    icon: mdi:volume-high
    mode: restart
    sequence:
    - alias: Audio-Lautstärke für diese Szene auf 80 Prozent einstellen
      action: media_player.volume_set
      target:
        entity_id: media_player.funkel_audio_station_1
      data:
        volume_level: 0.8
      continue_on_error: true
    - alias: 'Abspielen: Clip1A_1_Funkel.mp3'
      action: media_player.play_media
      target:
        entity_id: media_player.funkel_audio_station_1
      data:
        media_content_id: media-source://media_source/local/funkel_luna/Audio/Clip1A_1_Funkel.mp3
        media_content_type: audio/mpeg
    - alias: 'Prüfen: Player hat tatsächlich mit der Wiedergabe begonnen'
      wait_template: '{{ is_state(''media_player.funkel_audio_station_1'', ''playing'') }}'
      timeout: 00:00:30
      continue_on_timeout: true
    - if:
      - '{{ not wait.completed }}'
      then:
      - action: persistent_notification.create
        data:
          title: Funkel & Luna · Wiedergabe nicht bestätigt
          message: 'Clip1A_1_Funkel.mp3 auf media_player.funkel_audio_station_1: Kein PLAYING-Status innerhalb von 30 s. Die automatische Clipfolge wurde zum Schutz
            angehalten. Nutze die Einzelsteuerung und prüfe den Player-Status.'
      - stop: Der Player meldet keinen Wiedergabestart.
    - alias: Bis zum echten Dateiende warten (Pause zählt NICHT als Ende)
      wait_template: '{{ states(''media_player.funkel_audio_station_1'') in [''idle'', ''off'', ''standby''] }}'
      timeout: 00:15:00
      continue_on_timeout: true
    - if:
      - '{{ not wait.completed }}'
      then:
      - action: persistent_notification.create
        data:
          title: Funkel & Luna · Player-Ende unbekannt
          message: 'Clip1A_1_Funkel.mp3 auf media_player.funkel_audio_station_1: Das Dateiende wurde nicht gemeldet. Keine automatische Fortsetzung; Szene bitte manuell
